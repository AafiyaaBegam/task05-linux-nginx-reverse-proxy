name: Task 05 Linux and Nginx validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nginx-config-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Nginx reverse-proxy configuration
        run: |
          docker run --rm \
            --volume "$PWD/nginx/nginx.conf:/etc/nginx/conf.d/task05.conf:ro" \
            nginx:1.27-alpine nginx -t
