# Include this file from the Nginx http {} context (for example,
# /etc/nginx/conf.d/task05.conf). Adjust the upstream to your app service.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=per_ip:10m;
proxy_cache_path /var/cache/nginx/task05 levels=1:2 keys_zone=static_cache:10m
                 max_size=100m inactive=60m use_temp_path=off;

upstream task05_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    server_tokens off;
    client_max_body_size 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    location = /health {
        proxy_pass http://task05_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    location /static/ {
        proxy_pass http://task05_backend;
        proxy_cache static_cache;
        proxy_cache_valid 200 10m;
        proxy_cache_bypass $http_authorization;
        proxy_no_cache $http_authorization;
        add_header X-Cache-Status $upstream_cache_status always;
        expires 10m;
    }

    location / {
        limit_req zone=api_limit burst=20 nodelay;
        limit_conn per_ip 20;

        proxy_pass http://task05_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Dynamic/API responses must not be cached.
        add_header Cache-Control "no-store" always;
    }
}
